[project]
name = "beta-clustering-utac"
version = "1.1.0"
description = "GenesisAeon Package 32 — beta-clustering over 78 threshold systems with Phi^(1/3) inter-cluster scaling"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Johann Römer" }]
requires-python = ">=3.11"
keywords = ["beta-clustering", "UTAC", "CREP", "GenesisAeon", "criticality", "phi-scaling"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "diamond-setup>=2.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/GenesisAeon/beta-clustering-utac"
Repository = "https://github.com/GenesisAeon/beta-clustering-utac"
Documentation = "https://genesisaeon.github.io/beta-clustering-utac"
Issues = "https://github.com/GenesisAeon/beta-clustering-utac/issues"
Zenodo = "https://doi.org/10.5281/zenodo.17472834"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beta_clustering"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP", "C4", "SIM"]
ignore = ["B008"]  # typer uses function calls in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=beta_clustering --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src/beta_clustering"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "types-pyyaml>=6.0.12.20260518",
]