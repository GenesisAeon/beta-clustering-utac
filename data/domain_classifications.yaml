# Domain classifications for beta-clustering-utac
# DOI: 10.5281/zenodo.17472834

domains:
  climate:
    beta_range: [0.05, 0.15]
    description: "Glacial cycles, ocean currents, ice sheets, biomes"
    examples: ["AMOC", "Arctic ice", "Amazon dieback", "Greenland melt"]

  ecological:
    beta_range: [0.15, 0.35]
    description: "Ecosystem tipping points, species dynamics, epidemics"
    examples: ["Coral bleaching", "Species extinction", "Epidemic onset"]

  neural:
    beta_range: [0.35, 0.65]
    description: "Neural criticality, consciousness, cognitive transitions"
    examples: ["Neural criticality", "Seizure onset", "Sleep-wake"]

  astrophysical:
    beta_range: [0.65, 1.20]
    description: "Stellar phenomena, accretion, gravitational events"
    examples: ["Stellar collapse", "Neutron star mass", "AGN ignition"]

  ai:
    beta_range: [1.20, 2.50]
    description: "Phase transitions in machine learning systems"
    examples: ["Grokking", "LLM emergence", "Double descent"]

phi_scaling:
  exponent: 0.3333333333
  phi: 1.6180339887
  phi_cuberoot: 1.17480502
  description: "Inter-cluster ratio ≈ Φ^(1/3) — universal scaling exponent"
  source: "UTAC v1.0 (DOI: 10.5281/zenodo.17472834)"
